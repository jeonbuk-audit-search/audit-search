name: 큰그릇실장 조회수 30분 자동 수집
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bigbowl-view-monitor
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect public board counts
        run: |
          cd view-monitor
          python monitor.py || true
      - name: Commit historical observations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add view-monitor/data/history.json view-monitor/data/history.csv
          if ! git diff --cached --quiet; then
            git commit -m 'chore: collect education-board view counts [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
