name: 큰그릇실장 조회수 30분 자동 수집 및 대시보드 배포
on:
  schedule:
    - cron: '11,26,41,56 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/view-monitor.yml'
      - 'view-monitor/site/index.html'
      - 'view-monitor/monitor.py'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: bigbowl-view-monitor
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect public board counts
        continue-on-error: true
        run: |
          cd view-monitor
          python monitor.py
      - name: Commit historical observations safely
        run: |
          set -euo pipefail
          if git diff --quiet -- view-monitor/data/history.json; then
            echo "No new observation to commit."
            exit 0
          fi
          python -c 'import os,json,pathlib;p=pathlib.Path("view-monitor/data/history.json");o=json.loads(p.read_text(encoding="utf-8"))["records"][-1];pathlib.Path(os.environ["RUNNER_TEMP"],"observation.json").write_text(json.dumps(o,ensure_ascii=False),encoding="utf-8")'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            echo "Safe history merge attempt $attempt"
            git fetch --no-tags origin main
            git reset --hard origin/main
            python view-monitor/merge_observation.py "$RUNNER_TEMP/observation.json"
            git add view-monitor/data/history.json view-monitor/data/history.csv
            if git diff --cached --quiet; then
              echo "Observation already stored."
              exit 0
            fi
            git commit -m "chore: merge education-board view observation [skip ci]"
            if git push origin HEAD:main; then
              echo "Observation merged and pushed."
              exit 0
            fi
            sleep "$((attempt * 2))"
          done
          echo "Could not commit after five attempts" >&2
          exit 1
      - name: Prepare dashboard
        run: |
          mkdir -p view-monitor/site/data
          cp view-monitor/data/history.json view-monitor/site/data/history.json
          cp view-monitor/data/history.csv view-monitor/site/data/history.csv
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v4
        with:
          path: view-monitor/site
      - name: Publish dashboard
        id: deployment
        uses: actions/deploy-pages@v4
